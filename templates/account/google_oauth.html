{% extends 'base.html' %}

{% block title %}Google Authentication (@sahyadri.edu.in) - scemquiz.arena{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 bg-white border">
            <div class="text-center mb-3">
                <i class="bi bi-google fs-1 text-purple"></i>
                <h4 class="fw-bold text-gradient-purple mt-2 mb-1">Google Workspace Sign-In</h4>
                <p class="text-muted small">Restricted strictly to <strong>@sahyadri.edu.in</strong></p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-bold">Sahyadri Google Email <span class="text-danger">*</span></label>
                    <input type="email" name="google_email" class="form-control" placeholder="name.branch26@sahyadri.edu.in" required>
                    <div class="form-text small text-danger">Must end with @sahyadri.edu.in.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">Full Name</label>
                    <input type="text" name="full_name" class="form-control" placeholder="e.g. Student Name">
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold">Track</label>
                    <select name="role_type" class="form-select">
                        <option value="NON_ZENKEN_STUDENT">Student (Quantitative Aptitude Track)</option>
                        <option value="ZENKEN_STUDENT">Zenken Scholar (Japan Career Track)</option>
                    </select>
                </div>

                <div class="d-grid mb-2">
                    <button type="submit" class="btn btn-purple py-2">Verify &amp; Authenticate</button>
                </div>
                <div class="text-center">
                    <a href="{% url 'account:login' %}" class="small text-muted">Cancel &bull; Standard Sign In</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
